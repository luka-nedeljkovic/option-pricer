[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricer"
version = "0.1.0"
description = "European option pricing under Black-Scholes: closed form and Monte Carlo with variance reduction."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luka Nedeljkovic" }]
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.9", "ipykernel", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "NPY"]